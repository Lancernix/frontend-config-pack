name: Release

# push 到 master 即自动发版：semantic-release 按 Conventional Commits 推导版本号
# （feat → minor，fix → major 修复线，breaking → major），发布走 npm OIDC
# trusted publishing（id-token 权限），无需 NPM_TOKEN secret。
# 前置条件：npmjs.com 上需把本仓库配置为 @lancernix/fe-base-config 的 trusted publisher。
on:
  push:
    branches: [master]

jobs:
  release:
    environment: release
    name: Test, Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format + lint)
        run: pnpm check

      - name: Release & Publish to NPM
        working-directory: packages/configs
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
