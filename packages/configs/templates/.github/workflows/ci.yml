name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 没写 version 时读取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm fmt:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
